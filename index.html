<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d5a8c">
  <link rel="manifest" href="./manifest.json">
  <title>事業マニュアル</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; }
    header { background: white; border-bottom: 1px solid #e5e7eb; padding: 1.2rem 1.5rem; }
    h1 { font-size: 1.5rem; color: #0f1729; margin-top: 0.5rem; }
    .container { max-width: 80rem; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 160px 1fr; gap: 1rem; }
    .sidebar { position: sticky; top: 5rem; height: 80vh; overflow-y: auto; }
    .category-btn { width: 100%; padding: 0.6rem 0.75rem; background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; cursor: pointer; font-weight: bold; font-size: 0.7rem; margin-bottom: 0.5rem; text-align: left; }
    .item-btn { width: 100%; padding: 0.5rem 0.75rem; background: white; border: none; border-bottom: 1px solid #e5e7eb; cursor: pointer; font-size: 0.65rem; text-align: left; }
    .item-btn.active { background: #f0f4f8; color: #2d5a8c; font-weight: 600; }
    .header-card { border: 4px solid #2d5a8c; padding: 0.9rem 1.2rem; margin-bottom: 0.6rem; border-radius: 0.5rem; }
    .tabs { display: flex; border-bottom: 1px solid #d1d5db; margin-bottom: 1rem; background: white; border-radius: 0.5rem 0.5rem 0 0; }
    .tab { flex: 1; padding: 0.75rem; text-align: center; cursor: pointer; font-size: 0.75rem; font-weight: 600; border-bottom: 3px solid transparent; color: #6b7280; }
    .tab.active { color: #2d5a8c; border-bottom-color: #2d5a8c; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .guidance-item { display: flex; gap: 0.75rem; padding: 0.75rem; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 0.5rem; }
    .guidance-icon { width: 20px; height: 20px; border-radius: 50%; background: #2d5a8c; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; flex-shrink: 0; }
    textarea { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.8rem; font-family: inherit; height: 5rem; color: #0f1729; background: #f9fafb; }
    .file-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #f3f4f6; border-radius: 0.5rem; font-size: 0.8rem; }
    .file-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; }
    .content { background: white; border-radius: 0.5rem; padding: 1.2rem; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .sidebar { position: static; height: auto; } }
  </style>
</head>
<body>
  <header>
    <p style="font-size: 0.65rem; color: #9ca3af; margin-bottom: 0.2rem;">BUSINESS STRATEGY</p>
    <h1>事業マニュアル</h1>
  </header>
  <div class="container">
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="header-card" id="header-card"></div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('guidance')">実行ガイダンス</div>
        <div class="tab" onclick="switchTab('effects')">期待効果</div>
        <div class="tab" onclick="switchTab('resources')">リソース</div>
      </div>
      <div id="guidance" class="tab-content active"></div>
      <div id="effects" class="tab-content"></div>
      <div id="resources" class="tab-content">
        <h3 style="font-size: 0.95rem; margin-bottom: 1rem; color: #0f1729;">学習メモ</h3>
        <textarea id="memo" style="margin-bottom: 1rem;"></textarea>
        <h3 style="font-size: 0.95rem; margin-bottom: 1rem; color: #0f1729;">添付ファイル</h3>
        <div class="file-list" id="file-list"></div>
        <input type="text" id="file-input" placeholder="ファイル名を入力" style="padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.8rem; margin-bottom: 0.5rem; width: 100%; display: block;">
        <button id="add-btn" style="width: 100%; padding: 0.5rem 1rem; background: #2d5a8c; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600;">+ ファイルを追加</button>
      </div>
    </div>
  </div>
  <script>

          { id: 3, title: '顧客分析', description: '顧客セグメント、ニーズ、購買行動の深掘り', guidance: ['セグメンテーション（デモ・サイコグラフィック・行動別）', '顧客ジャーニーマップの作成と痛点の抽出', 'LTV・CAC分析による採算性評価', 'NPS・顧客満足度データの定期取得'], effects: { shortTerm: '顧客ニーズの正確な理解、マーケティング精度向上', midTerm: 'セグメント別施策の最適化、顧客獲得コスト削減', longTerm: 'ロイヤルカスタマー育成、リテンション率向上' } },

          { id: 7, title: '顧客深耕', description: '既存顧客への活動拡大と関係強化', guidance: ['既存顧客のアップセル・クロスセル機会マップ作成', '顧客サクセス体制の構築と定期接点確保', 'ロイヤルティプログラムや特典の設計', '顧客フィードバック→プロダクト改善の仕組み化'], effects: { shortTerm: '既存顧客の満足度・NPS向上', midTerm: 'アップセル売上の増加、チャーン防止', longTerm: 'LTV向上による収益性改善' } },
